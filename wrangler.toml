name = "rewardtrackr"
main = "workers/worker.js"
compatibility_date = "2025-03-21"

# rewardtrackr.com's DNS origin is GitHub Pages (see .github/workflows/deploy.yml) —
# these routes only carve out the Worker's own API/proxy paths; every other path keeps
# going straight to GitHub Pages, untouched.
routes = [
	{ pattern = "rewardtrackr.com/se/*", zone_name = "rewardtrackr.com" },
	{ pattern = "rewardtrackr.com/bm/*", zone_name = "rewardtrackr.com" },
	{ pattern = "rewardtrackr.com/cc/*", zone_name = "rewardtrackr.com" },
	{ pattern = "rewardtrackr.com/api/*", zone_name = "rewardtrackr.com" },
	{ pattern = "rewardtrackr.com/view/*", zone_name = "rewardtrackr.com" },
	{ pattern = "rewardtrackr.com/announcement", zone_name = "rewardtrackr.com" },
	{ pattern = "rewardtrackr.com/rl-check", zone_name = "rewardtrackr.com" },
	{ pattern = "rewardtrackr.com/rl-rollback", zone_name = "rewardtrackr.com" },
	{ pattern = "rewardtrackr.com/share*", zone_name = "rewardtrackr.com" }
]

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "be4396d2374d4fbb9ae1f782179f9fe5"

[[kv_namespaces]]
binding = "STATS"
id = "38cbf75598354271b35cecd1fba305cb"

[[kv_namespaces]]
binding = "PRICE_HISTORY"
id = "deb1408fbb894b65b1d2ce02fbe2be0e"

# Cron Trigger for the scheduled() handler in workers/worker.js — fetches and
# stores daily BTC/GMT prices every day at 00:00 UTC.
[triggers]
crons = ["0 0 * * *"]

[vars]
# Public OAuth client_id (dynamically registered, no secret — see
# workers/lib/gomining-mcp.js) used to refresh the GoMining MCP access token.
# The refresh token itself lives in the PRICE_HISTORY KV under "gomining:oauth"
# (rotates on every use, so it can't be a static `wrangler secret`).
GOMINING_MCP_CLIENT_ID = "21fff519-9860-4c89-b0a9-12e55fb54e49"

# Secrets required — set via CLI, never commit them:
# wrangler secret put GITHUB_TOKEN   (for the /share endpoint)
# wrangler secret put CMC_API_KEY     (CoinMarketCap fallback for daily BTC/GMT prices)

[env.dev]
# Inherit top-level settings and deploy with:
# npx wrangler deploy --env dev
name = "rewardtrackr-dev"
routes = [
	{ pattern = "dev.rewardtrackr.com/*", zone_name = "rewardtrackr.com" }
]
