name = "rewardtrackr"
main = "workers/worker.js"
compatibility_date = "2025-03-21"

# The zone's origin is GitHub Pages; these routes only carve out the Worker paths.
routes = [
	{ pattern = "rewardtrackr.com/se/*", zone_name = "rewardtrackr.com" },
	{ pattern = "rewardtrackr.com/bm/*", zone_name = "rewardtrackr.com" },
	{ pattern = "rewardtrackr.com/cc/*", zone_name = "rewardtrackr.com" },
	{ pattern = "rewardtrackr.com/api/*", zone_name = "rewardtrackr.com" },
	{ pattern = "rewardtrackr.com/view/*", zone_name = "rewardtrackr.com" },
	{ pattern = "rewardtrackr.com/announcement", zone_name = "rewardtrackr.com" },
	{ pattern = "rewardtrackr.com/rl-check", zone_name = "rewardtrackr.com" },
	{ pattern = "rewardtrackr.com/rl-rollback", zone_name = "rewardtrackr.com" },
	{ pattern = "rewardtrackr.com/share*", zone_name = "rewardtrackr.com" }
]

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "be4396d2374d4fbb9ae1f782179f9fe5"

[[kv_namespaces]]
binding = "STATS"
id = "38cbf75598354271b35cecd1fba305cb"

[[kv_namespaces]]
binding = "PRICE_HISTORY"
id = "deb1408fbb894b65b1d2ce02fbe2be0e"

# scheduled() in workers/worker.js: daily BTC/GMT price snapshot at 00:00 UTC.
[triggers]
crons = ["0 0 * * *"]

[vars]
# Public OAuth client_id (no secret). The rotating refresh token lives in the
# PRICE_HISTORY KV under "gomining:oauth", not in a static secret.
GOMINING_MCP_CLIENT_ID = "21fff519-9860-4c89-b0a9-12e55fb54e49"

# Secrets (set via CLI, never commit):
# wrangler secret put GITHUB_TOKEN   (/share endpoints)
# wrangler secret put CMC_API_KEY    (CoinMarketCap price fallback)
# wrangler secret put CRYPTOCOMPARE_API_KEY    (CryptoCompare price fallback, used by the /cc proxy)

[env.dev]
# Deploy with: npx wrangler deploy --env dev
name = "rewardtrackr-dev"
routes = [
	{ pattern = "dev.rewardtrackr.com/*", zone_name = "rewardtrackr.com" }
]
